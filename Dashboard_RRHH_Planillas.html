<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RR.HH. Planillas — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f2ed; --bg2: #fff; --bg3: #f0ece5; --ink: #1a1612; --ink2: #3d3830;
  --muted: #9a9189; --border: #e2ddd6; --blue: #1a3a5c; --teal: #0d8a6f;
  --orange: #d4622a; --amber: #c48c1a; --red: #b83232; --purple: #5a3a7a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); font-family:'IBM Plex Sans',sans-serif; color:var(--ink); min-height:100vh; }

.layout { display:flex; min-height:100vh; }
.sidebar { width:230px; flex-shrink:0; background:var(--blue); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; }
.sidebar-logo { padding:28px 24px 24px; border-bottom:1px solid rgba(255,255,255,.1); }
.sidebar-logo .brand { font-family:'Playfair Display',serif; font-size:20px; font-weight:900; color:#fff; line-height:1; }
.sidebar-logo .sub { font-size:9px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,.4);
  margin-top:4px; font-family:'IBM Plex Mono',monospace; }
.nav { padding:20px 0; flex:1; }
.nav-section { font-size:8px; letter-spacing:4px; text-transform:uppercase; color:rgba(255,255,255,.3);
  padding:0 24px; margin:18px 0 8px; font-family:'IBM Plex Mono',monospace; }
.nav-section:first-child { margin-top:8px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:9px 24px; font-size:13px;
  color:rgba(255,255,255,.6); cursor:pointer; transition:.15s; border-left:3px solid transparent; }
.nav-icon { font-size:14px; width:18px; text-align:center; flex-shrink:0; }
.nav-item:hover:not(.disabled) { color:rgba(255,255,255,.9); background:rgba(255,255,255,.05); }
.nav-item.active { color:#fff; border-left-color:#f0c040; background:rgba(255,255,255,.08); }
.nav-item.disabled { color:rgba(255,255,255,.25); cursor:default; }
.nav-tier { font-size:8px; font-family:'IBM Plex Mono',monospace; color:rgba(255,255,255,.28); margin-left:auto; letter-spacing:1px; }
.sidebar-tag { padding:16px 24px; font-family:'IBM Plex Mono',monospace; font-size:9px; color:rgba(255,255,255,.2);
  letter-spacing:1.5px; border-top:1px solid rgba(255,255,255,.08); line-height:1.6; }

.tier-badge { font-size:9px; letter-spacing:3px; text-transform:uppercase; padding:4px 10px; border-radius:2px;
  font-family:'IBM Plex Mono',monospace; font-weight:600; }
.tier-badge.macro { background:var(--blue); color:#fff; }
.tier-badge.meso { background:var(--teal); color:#fff; }
.tier-badge.detalle { background:var(--bg3); color:var(--ink2); border:1px solid var(--border); }
.sec-head { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
.sec-head .num { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); }
.sec-head h2 { font-family:'Playfair Display',serif; font-weight:700; font-size:20px; margin:0; }
.sec-head .sub { font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
.sec-desc { font-size:12.5px; color:var(--ink2); max-width:680px; margin:4px 0 12px; line-height:1.5; }

.content { flex:1; min-width:0; }
.topbar { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 32px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
.page-title { font-family:'Playfair Display',serif; font-size:24px; font-weight:700; }
.page-title span { color:var(--orange); }
.topbar-right { display:flex; gap:10px; align-items:center; }
select { padding:8px 14px; border:1px solid var(--border); border-radius:2px; background:var(--bg3);
  font-family:'IBM Plex Sans',sans-serif; font-size:12px; cursor:pointer; }
.page { padding:18px 32px; }

/* Multi-select semanas (dropdown con checkboxes) */
.msem { position:relative; }
.msem-btn { padding:8px 14px; border:1px solid var(--border); border-radius:2px; background:var(--bg3);
  font-family:'IBM Plex Sans',sans-serif; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px;
  min-width:150px; justify-content:space-between; }
.msem-btn:after { content:'▾'; font-size:10px; color:var(--muted); }
.msem-panel { display:none; position:absolute; top:calc(100% + 4px); right:0; z-index:50; background:var(--bg2);
  border:1px solid var(--border); box-shadow:0 8px 24px rgba(26,22,18,.14); min-width:190px; max-height:320px;
  overflow-y:auto; padding:6px; }
.msem-panel.open { display:block; }
.msem-opt { display:flex; align-items:center; gap:8px; padding:7px 10px; font-size:12px; cursor:pointer;
  border-radius:2px; }
.msem-opt:hover { background:var(--bg3); }
.msem-opt.sep { border-top:1px solid var(--border); margin-top:4px; padding-top:10px; }
.msem-opt input { accent-color:var(--blue); cursor:pointer; }

.semaforo-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
.semaforo-card { background:var(--bg2); border:1px solid var(--border); border-left:3px solid var(--sc,var(--muted));
  padding:12px 14px; display:flex; gap:10px; align-items:flex-start; }
.semaforo-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:4px; background:var(--sc,var(--muted)); }
.semaforo-label { font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
.semaforo-val { font-size:12.5px; color:var(--ink2); font-weight:500; line-height:1.45; }
.semaforo-val b { color:var(--ink); }

.kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
.kpi-card { background:var(--bg2); border:1px solid var(--border); padding:14px 16px; position:relative; overflow:hidden; }
.kpi-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--kc,var(--blue)); }
.kpi-card-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.kpi-card-value { font-size:30px; font-family:'Playfair Display',serif; font-weight:700; line-height:1; }
.kpi-card-unit { font-size:14px; color:var(--muted); }
.kpi-badge { display:inline-flex; align-items:center; gap:3px; font-size:10px; margin-top:8px;
  font-family:'IBM Plex Mono',monospace; padding:3px 7px; border-radius:2px; }
.kpi-badge.pos { background:#e8f8f2; color:var(--teal); }
.kpi-badge.neg { background:#fdf0f0; color:var(--red); }

.card { background:var(--bg2); border:1px solid var(--border); padding:16px 18px; }
.card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;
  padding-bottom:8px; border-bottom:1px solid var(--border); }
.card-title { font-family:'Playfair Display',serif; font-size:15px; font-weight:700; }
.card-meta { font-size:10px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

.insight { padding:12px 14px; background:#eef4f8; border-left:3px solid var(--blue); }
.insight .t { font-size:10px; color:var(--blue); font-weight:600; letter-spacing:.5px; }
.insight .s { font-size:11.5px; color:var(--ink2); margin-top:3px; line-height:1.45; }

.hbar-list { display:flex; flex-direction:column; gap:12px; }
.hbar-top { display:flex; justify-content:space-between; margin-bottom:5px; }
.hbar-label { font-size:12px; color:var(--ink2); }
.hbar-val { font-size:12px; font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--ink); }
.hbar-track { height:8px; background:var(--bg3); border-radius:1px; overflow:hidden; }
.hbar-fill { height:100%; border-radius:1px; }

.grid-2 { display:grid; grid-template-columns:1.4fr 1fr; gap:12px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.col-stack { display:flex; flex-direction:column; gap:12px; }

.donut-section { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.donut-leg { display:flex; flex-direction:column; gap:10px; flex:1; min-width:170px; }
.leg-row { display:flex; align-items:center; gap:10px; }
.leg-sq { width:10px; height:10px; border-radius:2px; flex-shrink:0; }
.leg-name { font-size:12px; color:var(--ink2); flex:1; }
.leg-amt { font-size:10px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
.leg-pct { font-size:12px; font-family:'IBM Plex Mono',monospace; font-weight:500; }

.styled-table { width:100%; border-collapse:collapse; font-size:12px; }
.styled-table th { background:var(--bg3); padding:8px 10px; text-align:left; font-size:9px; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--muted); font-weight:500; border-bottom:2px solid var(--border); }
.styled-table th.num, .styled-table td.num { text-align:right; font-family:'IBM Plex Mono',monospace; }
.styled-table td { padding:9px 10px; border-bottom:1px solid var(--border); color:var(--ink2); }
.styled-table tr:last-child td { border-bottom:none; }
.rank-pos { font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--orange); }
.badge { display:inline-block; padding:3px 10px; font-size:10px; font-weight:600; border-radius:2px;
  text-transform:uppercase; letter-spacing:1px; }
.badge.red { background:#fdf0f0; color:var(--red); }
.badge.amber { background:#fff8e8; color:var(--amber); }
.badge.green { background:#e8f8f2; color:var(--teal); }

.mini-alert { padding:10px 12px; background:#fff8e8; border-left:3px solid var(--amber); }
.mini-alert.critical { background:#fdf0f0; border-left-color:var(--red); }
.mini-alert .t { font-size:10px; color:var(--amber); font-weight:600; }
.mini-alert.critical .t { color:var(--red); }
.mini-alert .s { font-size:11px; color:var(--ink2); margin-top:2px; }

.placeholder { padding:60px 24px; text-align:center; color:var(--muted); font-size:13px; }
.dyn-loading { padding:30px 24px; text-align:center; color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace; }

@media (max-width:1200px) { .grid-3 { grid-template-columns:1fr 1fr; } .grid-3 > .card:first-child { grid-column:1/-1; } }
@media (max-width:1000px) { .kpi-grid, .semaforo-grid { grid-template-columns:repeat(2,1fr); } }
@media (max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr !important; } }
@media (max-width:640px) { .kpi-grid, .semaforo-grid { grid-template-columns:1fr; } }
</style>
</head>

/* ───────── helpers de formato ───────── */
function fmtM(v) { return "S/ " + (v/1e6).toFixed(2) + "M"; }
function fmtK(v) { return "S/" + (v/1e3).toFixed(0) + "K"; }

/* ───────── selección múltiple de semanas ───────── */
function getSelectedWeeks() {
  var todasChk = document.getElementById("msemTodas");
  if (todasChk.checked) return null;
  var checks = document.querySelectorAll(".msem-check:checked");
  var arr = Array.prototype.map.call(checks, function (c) { return parseInt(c.value, 10); });
  if (!arr.length) { todasChk.checked = true; return null; }
  return arr;
}

function updateMsemLabel() {
  var weeks = getSelectedWeeks();
  var btn = document.getElementById("msemBtn");
  if (!weeks) btn.textContent = "Todas las semanas";
  else if (weeks.length === 1) btn.textContent = "Semana " + weeks[0];
  else btn.textContent = weeks.length + " semanas";
}

function etiquetaSemanas(weeks) {
  if (!weeks || !weeks.length) return "ACUMULADO";
  if (weeks.length === 1) return "SEMANA " + weeks[0];
  var s = weeks.slice().sort(function (a, b) { return a - b; });
  return "SEM. " + s.join(", ");
}

/* Ventana de semanas para gráficos de tendencia/heatmap: si hay selección
   activa se usan EXACTAMENTE esas semanas (ordenadas); si es "Todas" se usa
   una ventana fija de las últimas n semanas del fundo. */
function ventanaWeeks(fkey, weeks, n) {
  if (weeks && weeks.length) return weeks.slice().sort(function (a, b) { return a - b; });
  var semanas = DATA[fkey].semanas;
  return semanas.slice(Math.max(0, semanas.length - n));
}

    acc.he_horas += d.he_horas; acc.horas_tot += d.horas_tot;
    acc.he_total_dt += d.he_total_dt; acc.he_trabajadores += d.he_trabajadores;
    acc.sal_costo += d.sal_costo; acc.sal_boletas += d.sal_boletas;
    acc.bono_total_cat += (d.bono_total_cat || 0); acc.bono_boletas_total += (d.bono_boletas_total || 0);
    Object.keys(d.bono_cat_totales || {}).forEach(function (cat) { acc.bono_cat_totales[cat] = (acc.bono_cat_totales[cat] || 0) + d.bono_cat_totales[cat]; });
    Object.keys(d.bono_cat_conteo || {}).forEach(function (cat) { acc.bono_cat_conteo[cat] = (acc.bono_cat_conteo[cat] || 0) + d.bono_cat_conteo[cat]; });
    Object.keys(d.ubic_fundo || {}).forEach(function (k) { acc.ubic_fundo[k] = (acc.ubic_fundo[k] || 0) + d.ubic_fundo[k]; });
    Object.keys(d.ubic_gerencia || {}).forEach(function (k) { acc.ubic_gerencia[k] = (acc.ubic_gerencia[k] || 0) + d.ubic_gerencia[k]; });
    Object.keys(d.he_areas || {}).forEach(function (k) { acc.he_areas[k] = (acc.he_areas[k] || 0) + d.he_areas[k]; });
    Object.keys(d.bono_areas || {}).forEach(function (k) {
      if (!acc.bono_areas[k]) acc.bono_areas[k] = {};
      var cats = d.bono_areas[k];
      Object.keys(cats).forEach(function (cat) {
        acc.bono_areas[k][cat] = (acc.bono_areas[k][cat] || 0) + cats[cat];
      });
    });
    Object.keys(d.sal_areas || {}).forEach(function (k) {
      if (!acc.sal_areas[k]) acc.sal_areas[k] = { costo: 0, boletas: 0 };
      acc.sal_areas[k].costo += d.sal_areas[k].costo;
      acc.sal_areas[k].boletas += d.sal_areas[k].boletas;
    });
  });
  // Costo_Por_Jornada real (01.03) invoca CALCULATE con filtro directo en
  // 'DNominas'[SEMANA] + TREATAS en 'DNominas'[NomFundo] — pero la relación
  // DNominas→Semanas→DTareo es de un solo sentido, así que ese filtro NUNCA
  // llega a DTareo. Cantidad_Jornadas termina siendo una constante global
  // (TODO DTareo, sin filtrar por semana ni fundo) — bug real, replicado tal cual.
  acc.jornal = CANTIDAD_JORNADAS_GLOBAL ? acc.costo / CANTIDAD_JORNADAS_GLOBAL : 0;
  acc.pct_bonos_vs_planilla = acc.ingreso_bruto ? acc.bonos / acc.ingreso_bruto : 0;
  acc.pct_bono_beta_vs_planilla = acc.ingreso_bruto ? acc.bono_beta / acc.ingreso_bruto : 0;
  acc.pct_costo_he = acc.costo ? acc.monto_he / acc.costo : 0;
  acc.pct_he_vs_horas_normales = acc.horas_tot ? acc.he_horas / acc.horas_tot : 0;
  acc.semanasUsadas.sort(function (a, b) { return a - b; });
  return acc;
}

function anteriorFor(fkey, weeks) {
  var fd = DATA[fkey];
  if (!fd) return null;
  if (!weeks || !weeks.length) {
    var v8 = fd.ventana8;
    if (v8.length >= 2) return sumSel(fkey, [v8[v8.length - 2].semana]);
    return null;
  }
  var minSem = Math.min.apply(null, weeks);
  var prev = minSem - 1;
  return fd.porSemana[prev] ? sumSel(fkey, [prev]) : null;
}

function badge(actual, anterior, pp, invertido) {
  if (anterior === null || anterior === undefined) return ["—", "pos"];
  var dif = actual - anterior;
  var positivo = invertido ? (dif <= 0) : (dif >= 0);
  var clase = positivo ? "pos" : "neg";
  var flecha = dif >= 0 ? "↑" : "↓";
  if (pp) return [flecha + " " + Math.abs(dif * 100).toFixed(1) + "pp", clase];
  var pct = anterior ? (dif / anterior) : 0;
  return [flecha + " " + Math.abs(pct * 100).toFixed(1) + "%", clase];
}

function sparklineSvg(values, color) {
  if (!values || values.length < 2) return "";
  var vmax = Math.max.apply(null, values), vmin = Math.min.apply(null, values);
  var rango = (vmax - vmin) || 1;
  var n = values.length;
  var pts = values.map(function (v, i) {
    var x = (i / (n - 1) * 100).toFixed(1);
    var y = (26 - ((v - vmin) / rango * 20 + 3)).toFixed(0);
    return x + "," + y;
  }).join(" ");
  return "<svg class='kpi-spark' viewBox='0 0 100 26' preserveAspectRatio='none' style='margin-top:10px;display:block'>" +
    "<polyline points='" + pts + "' fill='none' stroke='" + color + "' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>";
}

/* ───────── RESUMEN EJECUTIVO ───────── */
function buildSemaforo(agg, prevAgg) {
  var pctHe = agg.pct_costo_he, pctBonos = agg.pct_bonos_vs_planilla;
  var colorHe = pctHe > UMBRALES.he ? "var(--red)" : "var(--teal)";
  var colorBonos = pctBonos > UMBRALES.bonos ? "var(--red)" : "var(--teal)";
  var restoHe = pctHe > UMBRALES.he ? "supera el umbral (30%)" : "dentro del umbral (máx. 30%)";
  var restoBonos = pctBonos > UMBRALES.bonos ? "supera el umbral (25%)" : "dentro del umbral (máx. 25%)";
  // Nota: 01.02.HTML_ALT1_Semaforo_Alertas real tiene una 3ra tarjeta
  // ("Incremento por Área" — variación de HE de Cosecha desde la semana base
  // del fundo), distinta a la tarjeta genérica que había aquí antes (no
  // existía en el modelo real) — se retira por pedido explícito hasta
  // implementar la versión real.
  return "<div class='semaforo-grid'>" +
    "<div class='semaforo-card' style='--sc:" + colorHe + "'><div class='semaforo-dot'></div><div><div class='semaforo-label'>H. Extra vs Sueldo Base</div>" +
    "<div class='semaforo-val'><b>" + (pctHe * 100).toFixed(1) + "%</b> del sueldo base — " + restoHe + "</div></div></div>" +
    "<div class='semaforo-card' style='--sc:" + colorBonos + "'><div class='semaforo-dot'></div><div><div class='semaforo-label'>Bonos vs Salario</div>" +
    "<div class='semaforo-val'><b>" + (pctBonos * 100).toFixed(1) + "%</b> del salario — " + restoBonos + "</div></div></div></div>";
}

function buildKpiGrid(fkey, agg, prevAgg) {
  var v8 = DATA[fkey].ventana8;
  var costos = v8.map(function (x) { return x.costo; });
  var jornales = v8.map(function (x) { return x.jornal; });
  var pctsHe = v8.map(function (x) { return x.pct_he; });
  var pctsBonos = v8.map(function (x) { return x.pct_bonos; });
  var pctsBonoBeta = v8.map(function (x) { return x.pct_bono_beta; });
  var s1 = v8.length ? v8[v8.length - 1].semana : null;
  var s8 = v8.length ? v8[0].semana : null;
  var etiquetaAcum = s1 ? ("Acum. S" + s8 + "—S" + s1) : "";

  var bCosto = badge(agg.costo, prevAgg ? prevAgg.costo : null);
  var bJornal = badge(agg.jornal, prevAgg ? prevAgg.jornal : null);
  var bHe = badge(agg.pct_he_vs_horas_normales, prevAgg ? prevAgg.pct_he_vs_horas_normales : null, true, true);
  var bBonos = badge(agg.pct_bonos_vs_planilla, prevAgg ? prevAgg.pct_bonos_vs_planilla : null, true, false);
  var bBonoBeta = badge(agg.pct_bono_beta_vs_planilla, prevAgg ? prevAgg.pct_bono_beta_vs_planilla : null, true, false);

  var sufijo = "";
  if (prevAgg && prevAgg.semanasUsadas && prevAgg.semanasUsadas.length) {
    sufijo = " vs S" + prevAgg.semanasUsadas[prevAgg.semanasUsadas.length - 1];
  }

  function card(label, valor, unidad, b, spark, color, extraLine) {
    var suf = b[0] !== "—" ? sufijo : "";
    return "<div class='kpi-card' style='--kc:" + color + "'><div class='kpi-card-label'>" + label + "</div>" +
      "<div class='kpi-card-value'>" + valor + "<span class='kpi-card-unit'>" + unidad + "</span></div>" +
      (extraLine ? "<div style='font-size:11px;color:var(--muted);margin-top:4px;font-family:IBM Plex Mono,monospace'>" + extraLine + "</div>" : "") +
      "<div class='kpi-badge " + b[1] + "'>" + b[0] + suf + "</div>" + spark + "</div>";
  }

  return "<div class='kpi-grid'>" +
    card("Costo Total · " + etiquetaAcum, "S/ " + (agg.costo / 1e6).toFixed(2), "M", bCosto, sparklineSvg(costos, "#1a3a5c"), "var(--blue)") +
    card("Costo Jornal", "S/ " + agg.jornal.toFixed(2), "", bJornal, sparklineSvg(jornales, "#d4622a"), "var(--orange)") +
    card("% Horas Extra", (agg.pct_he_vs_horas_normales * 100).toFixed(1), "%", bHe, sparklineSvg(pctsHe, "#c48c1a"), "var(--amber)") +
    card("% Bonos / Planilla", (agg.pct_bonos_vs_planilla * 100).toFixed(1), "%", bBonos, sparklineSvg(pctsBonos, "#5a3a7a"), "var(--purple)") +
    card("% Bono Beta / Planilla", (agg.pct_bono_beta_vs_planilla * 100).toFixed(1), "%", bBonoBeta, sparklineSvg(pctsBonoBeta, "#c48c1a"), "var(--amber)", fmtK(agg.bono_beta) + " pagados") +
    "</div>";
}

function buildDonutResumen(agg, prevAgg, etiqueta) {
  var costo = agg.costo, montoHe = agg.monto_he, bonos = agg.bonos;
  var montoBase = costo - montoHe - bonos;
  var pctBase = costo ? montoBase / costo : 0;
  var pctHe = costo ? montoHe / costo : 0;
  var pctBonos = costo ? bonos / costo : 0;
  var circ = 251;
  var largoBase = Math.round(pctBase * circ);
  var largoHe = Math.round(pctHe * circ);
  var largoBonos = Math.round(pctBonos * circ);
  var offHe = largoBase;
  var offBonos = largoBase + largoHe;

  var insight;
  if (prevAgg && prevAgg.costo > 0) {
    var varCosto = (costo - prevAgg.costo) / prevAgg.costo;
    var semPrev = prevAgg.semanasUsadas.length ? prevAgg.semanasUsadas[prevAgg.semanasUsadas.length - 1] : "";
    insight = "El costo total " + (varCosto >= 0 ? "creció" : "bajó") + " " + Math.abs(varCosto * 100).toFixed(1) +
      "% frente a S" + semPrev + ". Las secciones siguientes detallan horas extra y bonos por área.";
  } else {
    insight = "Primer período con datos disponibles. Las secciones siguientes detallan horas extra y bonos por área.";
  }

  var filasLeg = [
    { n: "Salario base", v: montoBase, p: pctBase, c: "#1a3a5c" },
    { n: "Horas extra", v: montoHe, p: pctHe, c: "#d4622a" },
    { n: "Bonos", v: bonos, p: pctBonos, c: "#5a3a7a" }
  ].sort(function (a, b) { return b.p - a.p; });
  var leyenda = filasLeg.map(function (d) {
    return "<div style='display:flex;align-items:center;gap:10px'><span style='width:12px;height:9px;background:" + d.c + ";display:inline-block'></span>" +
      "<span style='font-size:13px;flex:1'>" + d.n + " <span style='color:var(--muted);font-size:12px'>" + fmtM(d.v) + "</span></span>" +
      "<span style='font-size:13px;font-family:IBM Plex Mono,monospace;font-weight:600'>" + (d.p * 100).toFixed(1) + "%</span></div>";
  }).join("");

  return "<div class='card' style='margin-top:10px'>" +
    "<div class='card-head'><div class='card-title'>¿En qué se fue el 100% del costo?</div><div class='card-meta'>COMPOSICIÓN · " + etiqueta + "</div></div>" +
    "<div style='display:flex;align-items:center;gap:26px;flex-wrap:wrap'>" +
    "<svg width='170' height='170' viewBox='0 0 170 170'><g transform='rotate(-90 85 85)'>" +
    "<circle cx='85' cy='85' r='58' fill='none' stroke='#1a3a5c' stroke-width='26' stroke-dasharray='" + largoBase + " " + (circ - largoBase) + "' stroke-dashoffset='0'></circle>" +
    "<circle cx='85' cy='85' r='58' fill='none' stroke='#d4622a' stroke-width='26' stroke-dasharray='" + largoHe + " " + (circ - largoHe) + "' stroke-dashoffset='-" + offHe + "'></circle>" +
    "<circle cx='85' cy='85' r='58' fill='none' stroke='#5a3a7a' stroke-width='26' stroke-dasharray='" + largoBonos + " " + (circ - largoBonos) + "' stroke-dashoffset='-" + offBonos + "'></circle>" +
    "</g><text x='85' y='80' text-anchor='middle' style='font-size:19px;font-weight:700;fill:var(--ink);font-family:Playfair Display,serif'>" + fmtM(costo) + "</text>" +
    "<text x='85' y='96' text-anchor='middle' style='font-size:9px;fill:var(--muted);font-family:IBM Plex Mono,monospace'>TOTAL</text></svg>" +
    "<div style='display:flex;flex-direction:column;gap:10px;flex:1'>" + leyenda + "</div></div>" +
    "<div class='insight' style='margin-top:20px'><div class='t'>LO QUE SIGUE</div><div class='s'>" + insight + "</div></div></div>";
}

function renderResumenDinamico(fkey, weeks) {
  var el = document.getElementById("dinResumen");
  if (!el) return;
  var agg = sumSel(fkey, weeks);
  if (!agg) { el.innerHTML = "<div class='placeholder'>Sin datos.</div>"; return; }
  // "Todas las semanas" (sin filtro activo): Costo Total y %_HorasExtras_vs_Normales
  // en 01.03 son CALCULATE con ALL(SEMANA)/ALL(Semana_Correcta) — el GRAN TOTAL
  // sobre TODA la tabla, no la suma de porSemana (que solo cubre las semanas
  // presentes en DNominas; DTareo puede tener cobertura distinta). Se usan los
  // agregados globales precomputados en vez de sumar semana por semana.
  if (!weeks || !weeks.length) {
    var g = DATA[fkey].heGlobal;
    agg.costo = DATA[fkey].costoGlobal;
    agg.pct_he_vs_horas_normales = g.horas_tot ? g.he_horas / g.horas_tot : 0;
    agg.jornal = CANTIDAD_JORNADAS_GLOBAL ? agg.costo / CANTIDAD_JORNADAS_GLOBAL : 0;
  }
  var prevAgg = anteriorFor(fkey, weeks);
  var etiqueta = etiquetaSemanas(weeks);
  el.innerHTML = buildSemaforo(agg, prevAgg) + buildKpiGrid(fkey, agg, prevAgg) + buildDonutResumen(agg, prevAgg, etiqueta);
}

/* ───────── COSTOS GENERALES ───────── */
function buildUbicacion(agg) {
  var fundoEntries = Object.keys(agg.ubic_fundo).map(function (k) { return [k, agg.ubic_fundo[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  var maxFundo = fundoEntries.length ? Math.max.apply(null, fundoEntries.map(function (e) { return e[1]; })) : 1;
  var filasFundo = fundoEntries.map(function (e) {
    var w = Math.round(e[1] / maxFundo * 100);
    return "<div class='hbar-item'><div class='hbar-top'><span class='hbar-label'>" + e[0] + "</span><span class='hbar-val'>" + fmtM(e[1]) + "</span></div>" +
      "<div class='hbar-track'><div class='hbar-fill' style='width:" + w + "%;background:#1a3a5c'></div></div></div>";
  }).join("");

  var gerEntries = Object.keys(agg.ubic_gerencia).map(function (k) { return [k, agg.ubic_gerencia[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  var filasGerencia;
  if (!gerEntries.length) {
    filasGerencia = "<div class='hbar-item'><div class='hbar-top'><span class='hbar-label'>Sin datos de gerencia</span></div></div>";
  } else {
    var maxGer = Math.max.apply(null, gerEntries.map(function (e) { return e[1]; }));
    filasGerencia = gerEntries.map(function (e) {
      var w = Math.round(e[1] / maxGer * 100);
      return "<div class='hbar-item'><div class='hbar-top'><span class='hbar-label'>" + e[0] + "</span><span class='hbar-val'>" + fmtM(e[1]) + "</span></div>" +
        "<div class='hbar-track'><div class='hbar-fill' style='width:" + w + "%;background:#d4622a'></div></div></div>";
    }).join("");
  }

  return "<div class='hbar-list'>" + filasFundo + "</div>" +
    "<div style='margin-top:20px;padding-top:16px;border-top:1px solid var(--border)'><div class='card-meta' style='margin-bottom:12px'>POR GERENCIA</div>" +
    "<div class='hbar-list'>" + filasGerencia + "</div></div>";
}

function renderCostosDinamico(fkey, weeks) {
  var el = document.getElementById("dinUbicacion");
  if (!el) return;
  var agg = sumSel(fkey, weeks);
  el.innerHTML = agg ? buildUbicacion(agg) : "<div class='placeholder'>Sin datos.</div>";
}

/* ───────── HORAS EXTRA ───────── */
function buildHorasAreas(agg, etiqueta) {
  var entries = Object.keys(agg.he_areas).map(function (k) { return [k, agg.he_areas[k]]; })
    .filter(function (e) { return e[1] > 0; }).sort(function (a, b) { return b[1] - a[1]; });
  if (!entries.length) return { html: "<div class='placeholder'>Sin datos.</div>", meta: "H. EXTRA · " + etiqueta };
  var maxHe = entries[0][1];
  var filas = entries.map(function (e, i) {
    var w = Math.round(e[1] / maxHe * 100);
    var color = i === 0 ? "#b83232" : "#d4622a";
    var meta = AREA_META[e[0]] || { labelHE: e[0] };
    return "<div style='margin-bottom:8px'><div style='display:flex;justify-content:space-between;margin-bottom:4px'>" +
      "<span style='font-size:12px;color:#1a1612'>" + meta.labelHE + "</span>" +
      "<span style='font-size:12px;font-family:IBM Plex Mono,monospace;font-weight:500;color:#1a1612'>" + Math.round(e[1]).toLocaleString("es-PE") + " h</span></div>" +
      "<div style='height:6px;background:#f0ece5;border-radius:1px'><div style='height:100%;width:" + w + "%;background:" + color + ";border-radius:1px'></div></div></div>";
  }).join("");

  var pctHext = agg.horas_tot ? (agg.he_total_dt / agg.horas_tot) : 0;
  var pctCostoHe = agg.pct_costo_he;
  var promTrab = agg.he_trabajadores ? (agg.he_total_dt / agg.he_trabajadores) : 0;

  var html = filas +
    "<div style='border-top:1px solid #e2ddd6;margin-top:6px;padding-top:8px'>" +
    "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2ddd6'><div style='font-size:12px;color:#9a9189'>% H.ext vs horas normales</div>" +
    "<div style='font-size:21px;font-family:Playfair Display,serif;font-weight:700;color:#1a1612'>" + (pctHext * 100).toFixed(1) + "%</div></div>" +
    "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2ddd6'><div style='font-size:12px;color:#9a9189'>Costo H.ext / planilla total</div>" +
    "<div style='font-size:21px;font-family:Playfair Display,serif;font-weight:700;color:#1a1612'>" + (pctCostoHe * 100).toFixed(1) + "%</div></div>" +
    "<div style='display:flex;justify-content:space-between;align-items:center;padding:8px 0'><div style='font-size:12px;color:#9a9189'>Prom. por trabajador</div>" +
    "<div style='font-size:21px;font-family:Playfair Display,serif;font-weight:700;color:#1a1612'>" + promTrab.toFixed(1) + " h</div></div></div>";
  return { html: html, meta: "H. EXTRA · " + etiqueta };
}

function buildHorasRanking(weeks, etiqueta) {
  var fundosFijos = ["Fundo HP", "Fundo BH", "Fundo Cao"];
  var list = (weeks && weeks.length) ? weeks : (function () {
    var all = []; for (var s in RANKING) all.push(parseInt(s, 10)); return all;
  })();
  var acc = {}; fundosFijos.forEach(function (f) { acc[f] = { he: 0, obreros: 0 }; });
  list.forEach(function (s) {
    var fila = RANKING[s];
    if (!fila) return;
    fundosFijos.forEach(function (f) {
      if (fila[f]) { acc[f].he += fila[f].he; acc[f].obreros += fila[f].obreros; }
    });
  });
  /* HProm = HE total del período / boletas totales del período (SUMX/DISTINCTCOUNT
     de la medida DAX 03.04.Ranking_Fundo_HE) — NUNCA promediar obreros por semana:
     eso infla el resultado ~n veces al seleccionar varias semanas. */
  var datos = fundosFijos.map(function (f) {
    var hprom = acc[f].obreros ? acc[f].he / acc[f].obreros : 0;
    return [f, hprom];
  });
  datos.sort(function (a, b) { return b[1] - a[1]; });

  var filas = datos.map(function (d, i) {
    var f = d[0], hprom = d[1];
    var nivel, bg, tc;
    if (hprom >= 2.4) { nivel = "ALTO"; bg = "#fdf0f0"; tc = "#b83232"; }
    else if (hprom >= 0.4) { nivel = "MEDIO"; bg = "#fff8e8"; tc = "#c48c1a"; }
    else { nivel = "BAJO"; bg = "#e8f8f2"; tc = "#0d8a6f"; }
    return "<div style='display:grid;grid-template-columns:30px 1fr 60px 80px;gap:12px;align-items:center;padding:11px 12px;border-bottom:1px solid #e2ddd6;font-size:12px'>" +
      "<div style='color:#3d3830;font-weight:600'>" + (i + 1) + "</div><div style='color:#3d3830'>" + f + "</div>" +
      "<div style='font-family:IBM Plex Mono,monospace;font-size:13px;font-weight:500;color:#3d3830;text-align:right'>" + hprom.toFixed(1) + "</div>" +
      "<div style='text-align:right'><span style='font-size:11px;font-weight:600;letter-spacing:1px;padding:3px 10px;border-radius:2px;background:" + bg + ";color:" + tc + ";display:inline-block;text-transform:uppercase;font-family:IBM Plex Mono,monospace'>" + nivel + "</span></div></div>";
  }).join("");

  var heGeneral = 0, obrGeneral = 0;
  fundosFijos.forEach(function (f) { heGeneral += acc[f].he; obrGeneral += acc[f].obreros; });
  var promGeneral = obrGeneral ? heGeneral / obrGeneral : 0;

  var html = "<div style='display:grid;grid-template-columns:30px 1fr 60px 80px;gap:12px;padding:10px 12px;background:#f0ece5;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9a9189;font-family:IBM Plex Mono,monospace;font-weight:500'>" +
    "<div>#</div><div>FUNDO</div><div style='text-align:right'>H/OBR</div><div style='text-align:right'>NIVEL</div></div>" + filas +

  return { html: html, meta: "PROM. H.EXTRA / OBRERO · " + etiqueta };
}

function buildTendenciaHE(fkey, weeks) {
  var ventana = ventanaWeeks(fkey, weeks, 8);
  var pS = DATA[fkey].porSemana;
  var valores = ventana.map(function (s) { return { semana: s, he: (pS[s] ? pS[s].he_boleta : 0) }; });
  if (!valores.length) return { html: "<div class='placeholder'>Sin datos.</div>", meta: "" };

  var maxHe = Math.max.apply(null, valores.map(function (v) { return v.he; })) || 1;
  var ultSem = valores[valores.length - 1].semana;
  var primSem = valores[0].semana;
  var heUltima = valores[valores.length - 1].he;
  var hePrimera = valores[0].he;
  var varAcum = hePrimera ? (heUltima - hePrimera) / hePrimera : 0;
  var tendenciaTxt = varAcum >= 0 ? "Tendencia al alza" : "Tendencia a la baja";
  var signo = varAcum >= 0 ? "+" : "-";

  var barras = valores.map(function (v, i) {
    var alto = Math.round((v.he / maxHe) * 130);
    var esUlt = i === valores.length - 1;
    var colorB = esUlt ? "#b83232" : "#d4622a";
    var colorT = esUlt ? "#b83232" : "#9a9189";
    var peso = esUlt ? "font-weight:600;" : "";
    return "<div style='display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1'>" +
      "<div style='font-size:12px;font-family:IBM Plex Mono,monospace;color:#1a1612;margin-bottom:4px'>" + Math.round(v.he).toLocaleString("es-PE") + "</div>" +
      "<div style='width:60%;height:" + alto + "px;background:" + colorB + "'></div>" +
      "<div style='font-size:12px;font-family:IBM Plex Mono,monospace;color:" + colorT + ";" + peso + "margin-top:6px'>S" + v.semana + "</div></div>";
  }).join("");

  var html = "<div style='display:flex;align-items:flex-end;gap:8px;height:185px;margin-bottom:10px'>" + barras + "</div>" +
    "<div style='padding:12px 14px;background:#fff8e8;border-left:3px solid #c48c1a'>" +
    "<div style='font-size:10px;color:#c48c1a;font-weight:600;font-family:IBM Plex Mono,monospace'>" + tendenciaTxt + "</div>" +
    "<div style='font-size:11px;color:#1a1612;margin-top:2px'>" + signo + Math.abs(varAcum * 100).toFixed(0) + "% acumulado desde S" + primSem + "</div></div>";

  return { html: html, meta: "HORAS EXTRA · S" + primSem + " — S" + ultSem };
}

function buildHeatmapHE(fkey, weeks) {
  var ventana = ventanaWeeks(fkey, weeks, 8);
  var pS = DATA[fkey].porSemana;
  if (!ventana.length) return { html: "<div class='placeholder'>Sin datos.</div>", meta: "" };

  var celdas = {};
  var maxCelda = 0;
  Object.keys(AREA_META).forEach(function (a) {
    ventana.forEach(function (s) {
      var v = (pS[s] && pS[s].he_areas) ? (pS[s].he_areas[a] || 0) : 0;
      celdas[a + "_" + s] = v;
      if (v > maxCelda) maxCelda = v;
    });
  });
  maxCelda = maxCelda || 1;

  function colorCelda(pct) {
    if (pct >= 0.75) return "#d4622a";
    if (pct >= 0.5) return "#e98d5b";
    if (pct >= 0.25) return "#f3b58f";
    return "#fbe3d3";
  }

  var header = "<tr><td style='width:110px'></td>" + ventana.map(function (s) {
    return "<td style='font-size:10px;font-weight:600;color:#9a9189;font-family:IBM Plex Mono,monospace;text-align:center;padding:4px 0'>S" + s + "</td>";
  }).join("") + "</tr>";

  var filas = Object.keys(AREA_META).map(function (a) {

      var bg, tc, texto;
      if (v === 0) { bg = "#faf7f2"; tc = "#1a1612"; texto = "·"; }
      else { bg = colorCelda(pct); tc = pct >= 0.5 ? "#fff" : "#1a1612"; texto = Math.round(v).toLocaleString("es-PE"); }
      return "<td style='background:" + bg + ";color:" + tc + ";height:32px;text-align:center;font-size:11px;font-family:IBM Plex Mono,monospace;border-radius:2px'>" + texto + "</td>";
    }).join("");
    return "<tr><td style='font-size:11px;text-align:left;padding-right:6px'>" + (AREA_META[a].labelHE.split(" y ")[0]) + "</td>" + celdasHtml + "</tr>";
  }).join("");

  var html = "<table style='border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed'>" + header + filas + "</table>";
  return { html: html, meta: "HEATMAP · INTENSIDAD = MÁS HORAS" };
}

var BONO_CAT_META = {
  beta: { label: "Beta", color: "#5a3a7a" },
  asistencia: { label: "Asistencia", color: "#0d8a6f" },
  cena: { label: "Cena", color: "#c48c1a" },

  arandano: { label: "Prod. Arándano", color: "#1a3a5c" },
  labores: { label: "Prod. Labores", color: "#9a6fb0" },
  otros: { label: "Otros", color: "#9a9189" }
};
var BONO_CAT_ORDEN = ["beta", "asistencia", "cena", "palta", "arandano", "labores", "otros"];

function sumaCategoriasArea(d) {
  return BONO_CAT_ORDEN.reduce(function (s, k) { return s + (d[k] || 0); }, 0);
}

/* ───────── BONOS ───────── */
function buildBonosDistribucion(agg, etiqueta) {
  var entries = Object.keys(agg.bono_areas).map(function (k) {
    var d = agg.bono_areas[k];
    var out = { area: k, total: sumaCategoriasArea(d) };
    BONO_CAT_ORDEN.forEach(function (cat) { out[cat] = d[cat] || 0; });
    return out;
  }).filter(function (d) { return d.total > 0; }).sort(function (a, b) { return b.total - a.total; });

  // totalBonos real (DAX) = totalBeta+...+totalOtros, INDEPENDIENTE del área
  // — no la suma de bono_areas (que excluye boletas sin NombreArea resuelto).
  var totalGrafico = agg.bono_total_cat || 0;

  // FIX v9c: agg.bono_areas solo cubre boletas con NombreArea resuelto — la
  // suma de "entries" puede quedar muy por debajo de totalGrafico (boletas
  // "Administrativo"/sin match quedan fuera), lo que dejaba un hueco real en
  // el donut ("gráfico no completo") y una tabla que no sumaba 100%. Se
  // agrega un segmento residual "Sin Área" (por categoría, calculado como
  // total_categoria_independiente - suma_de_areas_resueltas) para que el
  // donut y la tabla cierren exactamente al total real (S/14.81M).
  var sinArea = { area: "_sin_area", total: 0 };
  BONO_CAT_ORDEN.forEach(function (cat) {
    var totalCat = (agg.bono_cat_totales && agg.bono_cat_totales[cat]) || 0;
    var sumAreasCat = entries.reduce(function (acc, e) { return acc + (e[cat] || 0); }, 0);
    var resto = Math.max(0, totalCat - sumAreasCat);
    sinArea[cat] = resto;
    sinArea.total += resto;
  });
  if (sinArea.total > 0.5) entries.push(sinArea);

  if (!entries.length || !totalGrafico) return { html: "<div class='placeholder'>Sin bonos en este período.</div>", meta: etiqueta };

  function metaDe(area) {
    if (area === "_sin_area") return { labelBono: "Sin Área Asignada", color: "#9a9189" };
    return AREA_META[area] || { labelBono: area, color: "#9a9189" };
  }

  var circ = 251, acum = 0, segmentos = "";
  entries.forEach(function (d) {
    var meta = metaDe(d.area);
    var largo = totalGrafico ? Math.round(d.total / totalGrafico * circ) : 0;
    var hueco = circ - largo;
    var offset = totalGrafico ? Math.round(-1 * acum / totalGrafico * circ) : 0;
    segmentos += "<circle cx='55' cy='55' r='40' fill='none' stroke='" + meta.color + "' stroke-width='14' stroke-dasharray='" + largo + " " + hueco + "' stroke-dashoffset='" + offset + "'/>";
    acum += d.total;
  });

  var leyenda = entries.map(function (d) {
    var meta = metaDe(d.area);
    return "<div style='display:flex;align-items:center;gap:4px'><span style='width:7px;height:7px;border-radius:2px;background:" + meta.color + ";display:inline-block'></span>" +
      "<span style='font-size:9px;color:#3d3830'>" + meta.labelBono + "</span></div>";
  }).join("");

  var thCats = BONO_CAT_ORDEN.map(function (cat) {
    return "<th style='text-align:right;padding:4px 6px;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#9a9189;border-right:1px solid #e2ddd6' colspan='2'>Bono " + BONO_CAT_META[cat].label + "</th>";
  }).join("");

  var filasTabla = entries.map(function (d) {
    var meta = metaDe(d.area);
    var celdas = BONO_CAT_ORDEN.map(function (cat) {
      var pct = totalGrafico ? d[cat] / totalGrafico : 0;
      return "<td style='padding:8px 6px;font-size:11px;font-family:IBM Plex Mono,monospace;text-align:right;color:#3d3830'>" + fmtK(d[cat]) + "</td>" +
        "<td style='padding:8px 6px;font-size:11px;font-family:IBM Plex Mono,monospace;text-align:right;color:#9a9189;border-right:1px solid #e2ddd6'>" + (pct * 100).toFixed(1) + "%</td>";
    }).join("");
    var pctTotal = totalGrafico ? d.total / totalGrafico : 0;
    return "<tr style='border-bottom:1px solid #f0ece5'>" +
      "<td style='padding:8px 10px 8px 6px;font-size:12px;color:#3d3830;border-right:1px solid #e2ddd6'><span style='display:inline-block;width:8px;height:8px;border-radius:2px;background:" + meta.color + ";margin-right:6px'></span>" + meta.labelBono + "</td>" +
      celdas +
      "<td style='padding:8px 6px;font-size:11px;font-family:IBM Plex Mono,monospace;text-align:right;color:#1a1612;font-weight:600'>" + fmtK(d.total) + "</td>" +
      "<td style='padding:8px 6px 8px 6px;font-size:11px;font-family:IBM Plex Mono,monospace;text-align:right;color:#1a1612;font-weight:600'>" + (pctTotal * 100).toFixed(1) + "%</td></tr>";
  }).join("");

  var cantBoletas = agg.bono_boletas_total || 0;
  var pctPlanillaTotal = agg.costo ? totalGrafico / agg.costo : 0;

  var chips = BONO_CAT_ORDEN.map(function (cat) {
    var montoCat = (agg.bono_cat_totales && agg.bono_cat_totales[cat]) || 0;  // independiente del área
    var pctPlanillaCat = agg.costo ? montoCat / agg.costo : 0;
    var promTrabCat = cantBoletas ? montoCat / cantBoletas : 0;
    var conteoCat = (agg.bono_cat_conteo && agg.bono_cat_conteo[cat]) || 0;
    var pctAccedeCat = cantBoletas ? conteoCat / cantBoletas : 0;
    var meta = BONO_CAT_META[cat];
    return "<div style='text-align:center'><div style='font-size:9px;color:#9a9189;margin-bottom:3px'>" + meta.label + "</div>" +
      "<div style='font-size:13px;font-family:IBM Plex Mono,monospace;font-weight:600;color:#3d3830'>" + fmtK(montoCat) + "</div>" +
      "<div style='font-size:9px;color:#9a9189;margin-top:2px'>S/" + promTrabCat.toFixed(1) + " prom.</div>" +
      "<div style='font-size:9px;color:#c48c1a;margin-top:1px'>" + (pctAccedeCat * 100).toFixed(0) + "% accede</div>" +
      "<div style='font-size:9px;color:#5a3a7a;margin-top:1px;font-weight:600'>" + (pctPlanillaCat * 100).toFixed(1) + "% planilla</div></div>";
  }).join("");

  var html = "<div style='display:flex;align-items:flex-start;gap:18px;margin-top:10px;flex-wrap:wrap'>" +
    "<div style='flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:10px'>" +
    "<svg viewBox='0 0 110 110' style='width:120px;height:120px'><g transform='rotate(-90 55 55)'>" + segmentos + "</g>" +
    "<text x='55' y='51' text-anchor='middle' style='font-family:Playfair Display,serif;font-size:15px;font-weight:700;fill:#1a1612'>" + fmtM(totalGrafico) + "</text>" +
    "<text x='55' y='64' text-anchor='middle' style='font-size:7px;letter-spacing:2px;fill:#9a9189'>TOTAL</text></svg>" +
    "<div style='display:grid;grid-template-columns:1fr 1fr;gap:4px 10px'>" + leyenda + "</div></div>" +
    "<div style='flex:1;min-width:320px;overflow-x:auto'><table style='width:100%;border-collapse:collapse'>" +
    "<thead><tr style='border-bottom:2px solid #e2ddd6'>" +
    "<th style='text-align:left;padding:4px 10px 4px 6px;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#9a9189;border-right:1px solid #e2ddd6'>Área</th>" +
    thCats +
    "<th style='text-align:right;padding:4px 6px;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#9a9189' colspan='2'>Total</th></tr></thead><tbody>" + filasTabla + "</tbody></table></div></div>" +
    "<div style='margin-top:12px;padding-top:10px;border-top:1px solid #e2ddd6;background:#f0ece5;padding:14px 18px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap'>" +
    "<div style='text-align:center;flex-shrink:0'><div style='font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#9a9189;margin-bottom:4px;white-space:nowrap'>% Bono / Planilla Total</div>" +
    "<div style='font-family:Playfair Display,serif;font-size:22px;font-weight:700;color:#5a3a7a'>" + (pctPlanillaTotal * 100).toFixed(1) + "%</div></div>" +
    "<div style='width:1px;align-self:stretch;background:#e2ddd6;flex-shrink:0'></div>" +
    "<div style='display:flex;flex-wrap:wrap;justify-content:center;gap:8px'>" + chips + "</div></div>";

  return { html: html, meta: "TOTAL " + fmtM(totalGrafico) + " · " + etiqueta };
}

function buildComparativoBonos(fkey, weeks) {
  var ventana = ventanaWeeks(fkey, weeks, 7);
  var pS = DATA[fkey].porSemana;
  if (!ventana.length) return { html: "<div class='placeholder'>Sin datos.</div>", meta: "" };

  var filasSem = ventana.map(function (s) {
    var d = pS[s];
    var bonoTotal = (d && d.bono_total_cat) ? d.bono_total_cat : 0;  // FIX v9b: usa bono_total_cat (independiente del área), no suma bono_areas (excluye sin área)
    return { sem: s, bonos: bonoTotal, costoHe: d ? d.monto_he : 0, salCosto: d ? d.sal_costo : 0 };
  });

  var ult = filasSem[filasSem.length - 1];
  var penult = filasSem.length >= 2 ? filasSem[filasSem.length - 2] : null;
  var maxGlobal = Math.max.apply(null, filasSem.map(function (f) { return Math.max(f.bonos, f.costoHe); })) || 1;
  var varBonos = (penult && penult.bonos > 0) ? (ult.bonos - penult.bonos) / penult.bonos : 0;
  var pctPlanilla = ult.salCosto > 0 ? ult.bonos / ult.salCosto : 0;

  var filasHtml = filasSem.map(function (f) {
    var esUlt = f.sem === ult.sem;
    var anchoB = Math.round(f.bonos / maxGlobal * 100);
    var anchoH = Math.round(f.costoHe / maxGlobal * 100);
    var colorSem = esUlt ? "color:#d4622a;font-weight:600;" : "color:#9a9189;";
    var colorB = esUlt ? "color:#5a3a7a;" : "color:#3d3830;";
    var colorH = esUlt ? "color:#d4622a;" : "color:#3d3830;";
    return "<div style='display:grid;grid-template-columns:30px 1fr 60px 1fr 60px;gap:10px;align-items:center;padding:4px 0'>" +
      "<span style='font-size:12px;font-family:IBM Plex Mono,monospace;" + colorSem + "'>S" + f.sem + "</span>" +
      "<div style='height:8px;background:#f0ece5;border-radius:1px'><div style='height:100%;width:" + anchoB + "%;background:#5a3a7a;border-radius:1px'></div></div>" +
      "<span style='font-size:12px;font-family:IBM Plex Mono,monospace;font-weight:500;text-align:right;" + colorB + "'>" + fmtK(f.bonos) + "</span>" +
      "<div style='height:8px;background:#f0ece5;border-radius:1px'><div style='height:100%;width:" + anchoH + "%;background:#d4622a;border-radius:1px'></div></div>" +
      "<span style='font-size:12px;font-family:IBM Plex Mono,monospace;font-weight:500;text-align:right;" + colorH + "'>" + fmtK(f.costoHe) + "</span></div>";
  }).join("");

  var html = filasHtml +
    "<div style='border-top:1px solid #e2ddd6;margin-top:12px;padding-top:10px'>" +
    "<div style='display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid #e2ddd6'>" +
    "<div style='font-size:12px;color:#9a9189'>Bonos Totales / Planilla total (S" + ult.sem + ")</div>" +
    "<div style='font-size:20px;font-family:Playfair Display,serif;font-weight:700;color:#5a3a7a'>" + (pctPlanilla * 100).toFixed(1) + "%</div></div>" +
    "<div style='display:flex;justify-content:space-between;align-items:center;padding:2px 0'>" +
    "<div style='font-size:12px;color:#9a9189'>Variación bonos" + (penult ? (" S" + penult.sem + " → S" + ult.sem) : "") + "</div>" +
    "<div style='font-size:20px;font-family:Playfair Display,serif;font-weight:700;color:" + (varBonos >= 0 ? "#0d8a6f" : "#b83232") + "'>" + (varBonos >= 0 ? "+" : "") + (varBonos * 100).toFixed(1) + "%</div></div></div>" +
    "<div style='margin-top:6px;padding:10px 14px;background:#fff8e8;border-left:3px solid #c48c1a'>" +
    "<div style='font-size:10px;color:#c48c1a;font-weight:600;font-family:IBM Plex Mono,monospace'>Correlación bonos · h.extra</div>" +
    "<div style='font-size:11px;color:#1a1612;margin-top:2px'>Ambos crecen en paralelo — el bono podría estar empujando sobre-jornada</div></div>";

  return { html: html, meta: "BONOS TOTALES VS H.EXTRA · S/ MILES" };
}

  }

      return "<td style='background:" + bg + ";color:" + tc + ";height:32px;text-align:center;font-size:10px;font-family:IBM Plex Mono,monospace;border-radius:2px'>" + texto + "</td>";
    }).join("");
    return "<tr><td style='font-size:11px;text-align:left;padding-right:6px'>" + AREA_META[a].labelBono + "</td>" + celdasHtml + "</tr>";
  }).join("");

  var html = "<table style='border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed'>" + header + filas + "</table>" +
    "<div style='display:flex;align-items:center;gap:8px;margin-top:14px;font-size:10px;color:#9a9189;font-family:IBM Plex Mono,monospace'>" +
    "<span>Menor</span><div style='flex:1;max-width:160px;height:6px;border-radius:1px;background:linear-gradient(90deg, #d8cce6, #5a3a7a)'></div><span>Mayor</span></div>";

  return { html: html, meta: "S/ MILES" };
}

function renderBonosDinamico(fkey, weeks) {
  var elD = document.getElementById("dinBonosDistribucion");
  var elC = document.getElementById("dinBonosComp");
  if (!elD && !elC && !document.getElementById("dinBonosHeat_beta")) return;
  var etiqueta = etiquetaSemanas(weeks);
  if (elD) {
    var agg = sumSel(fkey, weeks);
    var res = agg ? buildBonosDistribucion(agg, etiqueta) : { html: "<div class='placeholder'>Sin datos.</div>", meta: etiqueta };
    elD.innerHTML = res.html;
    var meta = document.getElementById("dinBonosMeta"); if (meta) meta.textContent = res.meta;
  }
  if (elC) {
    var resC = buildComparativoBonos(fkey, weeks);
    elC.innerHTML = resC.html;
    var metaC = document.getElementById("dinBonosCompMeta"); if (metaC) metaC.textContent = resC.meta;
  }
  BONO_CAT_ORDEN.forEach(function (cat) {
    var elH = document.getElementById("dinBonosHeat_" + cat);
    if (!elH) return;
    var resH = buildHeatmapBonoCategoria(fkey, weeks, cat);
    elH.innerHTML = resH.html;
    var metaH = document.getElementById("dinBonosHeatMeta_" + cat); if (metaH) metaH.textContent = resH.meta;
  });
}

/* ───────── SALARIOS ───────── */
function buildSalComparativo(agg, etiqueta) {
  var salarioPromSemanal = agg.sal_boletas ? agg.sal_costo / agg.sal_boletas : 0;
  var catHtml = "<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px'>" +
    "<div style='padding:12px;background:#f0ece5'><div style='font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9a9189;margin-bottom:6px'>Salario Prom. Obrero</div>" +
    "<div style='font-family:Playfair Display,serif;font-size:22px;font-weight:700;color:#1a3a5c'>S/" + Math.round(salarioPromSemanal).toLocaleString("es-PE") + "</div></div>" +
    "<div style='padding:12px;background:#f0ece5'><div style='font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#9a9189;margin-bottom:6px'>Salario Prom. Empleado</div>" +
    "<div style='font-family:Playfair Display,serif;font-size:22px;font-weight:700;color:#9a9189'>Sin datos</div></div></div>";

  var entries = Object.keys(agg.sal_areas).map(function (k) {
    var d = agg.sal_areas[k];
    var salario = d.boletas ? d.costo / d.boletas : 0;
    return { area: k, salario: salario };
  }).filter(function (d) { return d.salario > 0; }).sort(function (a, b) { return b.salario - a.salario; });

  var areaHtml;
  if (!entries.length) {
    areaHtml = "<div class='placeholder'>Sin datos.</div>";
  } else {
    var maxSal = entries[0].salario;
    var colorArea = { COSECHA: "#d4622a", EMPAQUE: "#c48c1a", LABORES: "#0d8a6f", RIEGO: "#1a3a5c", SANIDAD: "#5a3a7a", OTROS: "#9a9189" };
    areaHtml = entries.map(function (d) {
      var w = Math.round(d.salario / maxSal * 100);
      var color = colorArea[d.area] || "#9a9189";
      var meta = AREA_META[d.area] || { labelHE: d.area };
      return "<div style='margin-bottom:12px'><div style='display:flex;justify-content:space-between;margin-bottom:5px'><span style='font-size:12px;color:#1a1612'>" + meta.labelHE + "</span>" +
        "<span style='font-size:12px;font-family:IBM Plex Mono,monospace;font-weight:500;color:#1a1612'>S/" + Math.round(d.salario).toLocaleString("es-PE") + "</span></div>" +
        "<div style='height:8px;background:#f0ece5;border-radius:1px'><div style='height:100%;width:" + w + "%;background:" + color + ";border-radius:1px'></div></div></div>";
    }).join("");
  }

  return { cat: catHtml, area: areaHtml, catMeta: "SALARIO PROM. · " + etiqueta };
}

function renderSalariosDinamico(fkey, weeks) {
  var elC = document.getElementById("dinSalCategoria");
  var elA = document.getElementById("dinSalArea");
  if (!elC && !elA) return;
  var agg = sumSel(fkey, weeks);
  var etiqueta = etiquetaSemanas(weeks);
  var res = agg ? buildSalComparativo(agg, etiqueta) :
    { cat: "<div class='placeholder'>Sin datos.</div>", area: "<div class='placeholder'>Sin datos.</div>", catMeta: etiqueta };
  if (elC) elC.innerHTML = res.cat;
  if (elA) elA.innerHTML = res.area;
  var metaC = document.getElementById("dinSalCategoriaMeta"); if (metaC) metaC.textContent = res.catMeta;
}

/* ───────── navegación y orquestación ───────── */
function irAPagina(pid) {
  paginaActual = pid;
  document.querySelectorAll(".nav-item").forEach(function (el) { el.classList.toggle("active", el.dataset.page === pid); });
  document.getElementById("pageTitle").innerHTML = TITULOS[pid] || pid;
  render(true);
}

function render(reloadSkeleton) {
  var fkey = document.getElementById("selFundo").value;
  if (reloadSkeleton) {
    var html = (PAGINAS[fkey] && PAGINAS[fkey][paginaActual] !== undefined) ? PAGINAS[fkey][paginaActual] : "<div class='placeholder'>Sección en construcción.</div>";
    document.getElementById("pageBody").innerHTML = html;
  }
  var weeks = getSelectedWeeks();
  if (paginaActual === "resumen") renderResumenDinamico(fkey, weeks);
  else if (paginaActual === "costos") renderCostosDinamico(fkey, weeks);
  else if (paginaActual === "horas") renderHorasDinamico(fkey, weeks);
  else if (paginaActual === "bonos") renderBonosDinamico(fkey, weeks);
  else if (paginaActual === "salarios") renderSalariosDinamico(fkey, weeks);
}

document.getElementById("selFundo").addEventListener("change", function () { render(true); });

document.getElementById("msemBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  document.getElementById("msemPanel").classList.toggle("open");
});
document.addEventListener("click", function (e) {
  var wrap = document.getElementById("msemWrap");
  if (wrap && !wrap.contains(e.target)) document.getElementById("msemPanel").classList.remove("open");
});
document.getElementById("msemTodas").addEventListener("change", function (e) {
  if (e.target.checked) { document.querySelectorAll(".msem-check").forEach(function (c) { c.checked = false; }); }
  updateMsemLabel(); render(false);
});
document.querySelectorAll(".msem-check").forEach(function (c) {
  c.addEventListener("change", function () {
    if (this.checked) document.getElementById("msemTodas").checked = false;
    var any = document.querySelectorAll(".msem-check:checked").length > 0;
    if (!any) document.getElementById("msemTodas").checked = true;
    updateMsemLabel(); render(false);
  });
});

/* Estado inicial: "Todas las semanas" seleccionado por defecto */
irAPagina("resumen");

</script>
